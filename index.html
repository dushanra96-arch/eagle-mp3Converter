<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle MP3 - YouTube Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-red-500">🦅 Eagle MP3</h1>
            <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">Fast YouTube Converter</span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-16 text-center flex-grow">
        <h2 class="text-4xl font-extrabold mb-4">YouTube to MP3 Converter</h2>
        <p class="text-slate-400 mb-8">Paste your YouTube link below to extract audio instantly.</p>

        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="urlInput" placeholder="Paste YouTube video link here..." 
                    class="flex-grow bg-slate-900 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500">
                <button onclick="convertVideo()" id="convertBtn"
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg">
                    Convert to MP3
                </button>
            </div>

            <div id="resultArea" class="mt-6 hidden">
                <div class="p-4 bg-slate-900 border border-slate-700 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3">
                    <span id="statusText" class="text-sm text-slate-300">Processing...</span>
                    <a id="downloadLink" href="#" class="bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-4 py-2 rounded-lg hidden">Download MP3 File</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Eagle MP3 Converter. Powered by Eagle Soft Solution.
    </footer>

    <script>
        async function convertVideo() {
            const url = document.getElementById('urlInput').value;
            const resultArea = document.getElementById('resultArea');
            const statusText = document.getElementById('statusText');
            const downloadLink = document.getElementById('downloadLink');

            if(!url) {
                alert("කරුණාකර YouTube Link එකක් ඇතුළත් කරන්න!");
                return;
            }

            resultArea.classList.remove('hidden');
            statusText.innerText = "Converting video to MP3, please wait...";
            downloadLink.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:5000/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();
                if(data.success) {
                    statusText.innerText = "Conversion completed successfully!";
                    downloadLink.href = `http://127.0.0.1:5000/download/${encodeURIComponent(data.filename)}`;
                    downloadLink.classList.remove('hidden');
                } else {
                    statusText.innerText = "Error: " + data.error;
                }
            } catch (err) {
                statusText.innerText = "Server connection failed!";
            }
        }
    </script>
</body>
</html>
